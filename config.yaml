# Phase-one configuration scaffold.
# Dataset, architecture, and training values remain provisional until specified.

project:
  name: CICIoT2023 CNN-Transformer Cyber Attack Detection
  random_seed: 42

paths:
  raw_data: data/raw
  processed_data: data/processed
  checkpoints: checkpoints
  experiments: experiments

# Development mode is intentionally small for debugging. Change the mode line
# to `mode: full` to process the complete dataset; development limits are
# ignored in full mode.
dataset:
  mode: development
  development:
    max_records_per_class: 1000
    max_records_per_file: null

Dataset:
  name: CICIoT2023
  source: TBD
  label_column: TBD
  task: TBD

preprocessing:
  input_features: TBD
  missing_value_strategy: TBD
  scaling: TBD
  categorical_encoding: TBD
  split_strategy: TBD

model:
  type: CNN-Transformer
  architecture: CNN -> reshape(8, 8) -> Transformer -> GlobalAveragePooling1D -> Dense(8) -> Softmax
  input_shape: [46, 1]
  num_classes: 8
  transformer_input_shape: [8, 8]
  aggregation: global_average

training:
  batch_size: TBD
  epochs: TBD
  learning_rate: TBD
  optimizer: TBD
  loss: TBD

evaluation:
  metrics: TBD
  reporting_protocol: TBD
